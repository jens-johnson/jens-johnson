#
#                                 ██        ██                     ▄▄
#                                 ▀▀        ▀▀                     ██
#                               ████      ████                ▄███▄██   ▄████▄   ██▄  ▄██
#                                 ██        ██               ██▀  ▀██  ██▄▄▄▄██   ██  ██
#                                 ██        ██      █████    ██    ██  ██▀▀▀▀▀▀   ▀█▄▄█▀
#                                 ██        ██               ▀██▄▄███  ▀██▄▄▄▄█    ████
#                                 ██        ██                 ▀▀▀ ▀▀    ▀▀▀▀▀      ▀▀
#                              ████▀     ████▀
#
# █████████████████████████████████████████████████████████████████████████████████████████████████████████████████████
# ███████████████████████████████████████ .github/workflows/release-please.yml ████████████████████████████████████████
#
# Automated releases: maintains a Release PR from conventional commits; merging it tags vX.Y.Z and publishes a GitHub
# Release, which consumers pin via git-tag installs.
#
# ─── SEE ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
#
#   • https://github.com/googleapis/release-please-action
#
# █████████████████████████████████████████████████████████████████████████████████████████████████████████████████████

name: 🏷️ Release Please

on:
  push:
    branches: [main]

# Opens/updates the Release PR and creates tags + GitHub Releases
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A fine-grained PAT (contents + pull-requests write) lets the auto-opened Release PR trigger the
          # required CI checks; GitHub suppresses downstream workflows for default-token actions. Falls back
          # to GITHUB_TOKEN (PR still opens; its checks need manual approval until the secret exists).
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
