# ██████████████████████████████████████████████ .github/dependabot.yml ███████████████████████████████████████████████
#
# Dependabot configuration: weekly npm updates (minor and patch grouped into a single PR) plus GitHub Actions version
# updates.
#
# █████████████████████████████████████████████████████████████████████████████████████████████████████████████████████

version: 2
updates:
  # npm dependencies: weekly, minor + patch grouped into one PR
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Conventional-commit messages so the CI commitlint gate passes (chore(deps): bump ...)
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Conventional-commit messages so the CI commitlint gate passes
    commit-message:
      prefix: chore(deps)
